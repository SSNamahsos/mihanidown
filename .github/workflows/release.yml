name: release

# A tag push like `v0.2.1` builds the standalone binaries for every target and
# attaches them to the GitHub release, so people without Node, Go or Python
# always have a current download.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build all targets
        run: |
          bun build src/cli.tsx --compile --target=bun-windows-x64  --outfile dist-bin/mihanidown-windows-x64.exe
          bun build src/cli.tsx --compile --target=bun-linux-x64    --outfile dist-bin/mihanidown-linux-x64
          bun build src/cli.tsx --compile --target=bun-linux-arm64  --outfile dist-bin/mihanidown-linux-arm64
          bun build src/cli.tsx --compile --target=bun-darwin-x64   --outfile dist-bin/mihanidown-macos-x64
          bun build src/cli.tsx --compile --target=bun-darwin-arm64 --outfile dist-bin/mihanidown-macos-arm64

      # Raw binaries on a release lose their executable bit, so the unix
      # targets ship as tarballs and the Windows exe ships as-is.
      - name: Package targets
        run: |
          cd dist-bin
          zip -9 mihanidown-windows-x64.zip mihanidown-windows-x64.exe
          tar -czf mihanidown-linux-x64.tar.gz mihanidown-linux-x64
          tar -czf mihanidown-linux-arm64.tar.gz mihanidown-linux-arm64
          tar -czf mihanidown-macos-x64.tar.gz mihanidown-macos-x64
          tar -czf mihanidown-macos-arm64.tar.gz mihanidown-macos-arm64
          rm mihanidown-linux-x64 mihanidown-linux-arm64 mihanidown-macos-x64 mihanidown-macos-arm64

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-bin/mihanidown-windows-x64.zip
            dist-bin/mihanidown-linux-x64.tar.gz
            dist-bin/mihanidown-linux-arm64.tar.gz
            dist-bin/mihanidown-macos-x64.tar.gz
            dist-bin/mihanidown-macos-arm64.tar.gz
